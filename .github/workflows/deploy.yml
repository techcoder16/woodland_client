name: Deploy frontend

# dev branch  -> https://dev.pms.woodlandltd.com (account 623553998786)
# main branch -> https://pms.woodlandltd.com     (account 549803795489)
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release bump for main (prod)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  id-token: write
  contents: write # push release tags

concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick environment
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "ENV=prod" >> "$GITHUB_ENV"
            echo "ACCOUNT=549803795489" >> "$GITHUB_ENV"
            echo "DISTRIBUTION=E3TJ9E5CQ7OE2Q" >> "$GITHUB_ENV"
            echo "VITE_API_URL=https://api.woodlandltd.com/api/" >> "$GITHUB_ENV"
          else
            echo "ENV=dev" >> "$GITHUB_ENV"
            echo "ACCOUNT=623553998786" >> "$GITHUB_ENV"
            echo "DISTRIBUTION=E6C7C0CP8B1M1" >> "$GITHUB_ENV"
            echo "VITE_API_URL=https://dev.api.woodlandltd.com/api/" >> "$GITHUB_ENV"
          fi

      - name: Work out release version (main only)
        if: env.ENV == 'prod'
        env:
          BUMP_INPUT: ${{ github.event.inputs.bump }}
        run: |
          git fetch --tags --force -q
          LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          LAST=${LAST:-v1.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<<"${LAST#v}"
          MSG=$(git log -1 --pretty=%B)
          BUMP=${BUMP_INPUT:-patch}
          if [ -z "$BUMP_INPUT" ]; then
            if grep -qi '#major' <<<"$MSG"; then BUMP=major; elif grep -qi '#minor' <<<"$MSG"; then BUMP=minor; fi
          fi
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *)     PATCH=$((PATCH+1)) ;;
          esac
          echo "VERSION=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_ENV"
          echo "Release v$MAJOR.$MINOR.$PATCH ($BUMP, previous $LAST)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_OFFICE_ADDRESS: ${{ secrets.VITE_PUBLIC_OFFICE_ADDRESS }}
          VITE_PUBLIC_OFFICE_CITY: ${{ secrets.VITE_PUBLIC_OFFICE_CITY }}
          VITE_PUBLIC_OFFICE_POSTCODE: ${{ secrets.VITE_PUBLIC_OFFICE_POSTCODE }}
          VITE_GETADDRESS_API_KEY: ${{ secrets.VITE_GETADDRESS_API_KEY }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/woodland-${{ env.ENV }}-github-deploy
          aws-region: eu-west-2

      - name: Upload to S3
        run: |
          BUCKET="woodland-$ENV-site-$ACCOUNT"
          # Hashed assets are immutable; index.html must always be re-fetched.
          aws s3 sync dist "s3://$BUCKET" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/index.html" "/" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$ID"
          echo "Deployed ${GITHUB_SHA::7} to $ENV" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag release
        if: env.ENV == 'prod' && success()
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a "$VERSION" -m "Release $VERSION (${GITHUB_SHA::7})"
          git push origin "$VERSION"
